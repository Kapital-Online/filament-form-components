name: Filament 4 uyumluluğu
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {laravel: '11.*', php: '8.3'}
          - {laravel: '12.*', php: '8.3'}
          - {laravel: '12.*', php: '8.5'}
          - {laravel: '13.*', php: '8.4'}
          - {laravel: '13.*', php: '8.5'}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, sqlite3, zip, gd
          coverage: none
          tools: composer:v2
      # Filament 3 / Laravel 10 matrisi eski ana sürümün dalında korunur.
      # Laravel 11 güvenlik istisnası yalnız bu çözümleme komutuna aittir.
      - name: Hedef Laravel bağımlılıklarını çözümle
        run: |
          legacy_policy=""
          if [ "${{ matrix.laravel }}" = "9.*" ] || [ "${{ matrix.laravel }}" = "10.*" ] || [ "${{ matrix.laravel }}" = "11.*" ]; then legacy_policy="--no-blocking"; fi
          composer update $legacy_policy --with "laravel/framework:${{ matrix.laravel }}" --prefer-dist --no-interaction --no-progress
      - name: Paket testleri
        run: php vendor/bin/phpunit
