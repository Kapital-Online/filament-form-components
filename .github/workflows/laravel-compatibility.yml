name: Filament 4 uyumluluğu
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_sqlite, sqlite3, zip, gd
          coverage: none
          tools: composer:v2
      # Filament 3 / Laravel 10 matrisi eski ana sürümün dalında korunur.
      # Laravel 11 güvenlik istisnası yalnız bu çözümleme komutuna aittir.
      - name: Filament 4 ve Laravel 11 bağımlılıklarını çözümle
        run: composer update --with 'laravel/framework:^11.28' --no-blocking --prefer-dist --no-interaction --no-progress
      - name: PHP 8.3 testleri
        run: php vendor/bin/phpunit
